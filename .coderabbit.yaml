# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Review configuration for public open-source pull requests.
# Requires installation of the CodeRabbit GitHub App; this file alone does not activate reviews.
language: "en-US"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
  path_filters:
    - "!**/node_modules/**"
    - "!**/.venv/**"
    - "!**/vendor/**"
    - "!**/build/**"
    - "!**/dist/**"
  path_instructions:
    - path: "**/*.py"
      instructions: |
        Focus on auth-key secrecy, safe logging, subprocess argument handling,
        process lifecycle, connectivity/reconnection, userspace networking,
        subnet-route validation, and compatibility with the Homey Python SDK.
    - path: ".github/workflows/**"
      instructions: |
        Review release integrity, credential handling, permissions and
        external downloads before approving workflow changes.
