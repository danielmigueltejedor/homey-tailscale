name: Prepare Homey App Store release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-homey-release.yml'
      - 'app.json'
      - '.homeychangelog.json'
      - 'assets/icon.svg'
      - '.homeyignore'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bundled version, architecture and app manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          app = json.loads(Path("app.json").read_text())
          version = app["version"]
          assert app["id"] == "com.danielmiguel.tailscale"
          import re
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), f"Invalid app version: {version}"
          assert version in json.loads(Path(".homeychangelog.json").read_text())

          tailscale_version = Path("bin/aarch64/VERSION").read_text().strip()
          assert re.fullmatch(r"\d+\.\d+\.\d+", tailscale_version), tailscale_version
          for name in ("tailscale", "tailscaled"):
              binary = Path("bin/aarch64") / name
              with binary.open("rb") as f:
                  magic = f.read(20)
              assert magic[:6] == b"\x7fELF\x02\x01" and magic[18:20] == b"\xb7\x00", name
              assert binary.stat().st_size > 1_000_000
          print(f"Homey {version}, Tailscale {tailscale_version}, ARM64 binaries verified")
          PY
      - name: Verify Python source and updater tests
        run: |
          python -m compileall -q app.py api.py drivers
          python -m unittest discover -s tests -v
      - name: Install Homey CLI
        run: npm install --global --include=optional homey
      - name: Validate for Homey App Store publishing
        run: homey app validate --level publish
      - name: Read app version
        id: meta
        run: echo "version=$(python -c 'import json; print(json.load(open("app.json"))["version"])')" >> "$GITHUB_OUTPUT"
      - name: Package ready-to-publish source
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("app.json"))["version"])')"
          mkdir -p dist
          tar -czf "dist/homey-tailscale-v${version}-publish-source.tar.gz" \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.homeybuild' \
            --exclude='./dist' \
            --exclude='./tests' \
            --exclude='./scripts' \
            --exclude='./__pycache__' \
            --exclude='./.gitignore' \
            -C . .
          sha256sum "dist/homey-tailscale-v${version}-publish-source.tar.gz" | tee "dist/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: homey-tailscale-v${{ steps.meta.outputs.version }}-publish-source
          path: dist/
          retention-days: 30
