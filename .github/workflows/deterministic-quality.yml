name: Deterministic Quality Gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch whitespace check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          else
            git show --format= --check HEAD
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python source syntax
        run: |
          python - <<'PY'
          import ast, pathlib, subprocess
          for name in subprocess.check_output(["git", "ls-files", "-z", "*.py"]).decode().split("\0"):
              if name and pathlib.Path(name).is_file():
                  ast.parse(pathlib.Path(name).read_text(encoding="utf-8"), filename=name)
          PY
